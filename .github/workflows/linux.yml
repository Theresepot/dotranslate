name: Linux Manual Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    # ... (previous steps remain the same until the Build with Xvfb step)

    - name: Build with Xvfb
      run: |
        # ... (previous build commands remain the same)

        # Create package structure
        mkdir -p debian-package/DEBIAN \
                debian-package/usr/local/bin \
                debian-package/usr/share/applications \
                debian-package/usr/share/icons/hicolor/256x256/apps

        # Copy executable
        cp dist/dotranslate debian-package/usr/local/bin/
        chmod +x debian-package/usr/local/bin/dotranslate

        # Create .desktop file
        cat > debian-package/usr/share/applications/dotranslate.desktop << EOF
        [Desktop Entry]
        Version=1.0
        Name=DoTranslate
        Comment=A translation tool using various translation services
        Exec=/usr/local/bin/dotranslate
        Icon=dotranslate
        Terminal=false
        Type=Application
        Categories=Utility;TextTools;
        Keywords=translate;translator;
        EOF

        # Make .desktop file executable
        chmod +x debian-package/usr/share/applications/dotranslate.desktop

        # Create a simple icon (replace this with your actual icon if you have one)
