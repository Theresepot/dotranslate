name: Linux Manual Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          fakeroot \
          dpkg-dev \
          python3-pip \
          python3-dev \
          pkg-config \
          libgl1-mesa-dev \
          libunwind-dev \
          libgstreamer1.0-dev \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          xvfb \
          xauth \
          libmtdev1 \
          patchelf

    - name: Install Python packages
      run: |
        python -m pip install --upgrade pip
        pip install 'pyinstaller<6.0'
        pip install -r requirements.txt

    - name: Build with Xvfb
      run: |
        # Start Xvfb
        Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
        export DISPLAY=:99
        
        # Get version
        VERSION=$(cat version.txt)
        echo "VERSION=$VERSION" >> $GITHUB_ENV

        # Build executable with specific options for better compatibility
        pyinstaller --onefile \
          --name dotranslate \
          --runtime-tmpdir /tmp \
          --hidden-import PIL._tkinter \
          --target-arch x86_64 \
          --strip \
          translator.py

        # Ensure GLIBC compatibility
        patchelf --set-rpath '$ORIGIN/lib' dist/dotranslate

        # Create package
        mkdir -p debian-package/DEBIAN debian-package/usr/local/bin
        cp dist/dotranslate debian-package/usr/local/bin/
        chmod +x debian-package/usr/local/bin/dotranslate

        # Create control file with specific dependencies
        cat > debian-package/DEBIAN/control << EOF
        Package: dotranslate
        Version: $VERSION
        Section: utils
        Priority: optional
        Architecture: amd64
        Maintainer: Theresepot
        Description: DoTranslate - A translation tool
         A tool for translating text using various translation services.
        Depends: libsdl2-2.0-0, libmtdev1, python3 (>= 3.9), libc6 (>= 2.31), libunwind8
        EOF

        # Build package
        dpkg-deb --build debian-package
        mv debian-package.deb dotranslate_${VERSION}_amd64.deb

        # Generate checksum
        sha256sum dotranslate_${VERSION}_amd64.deb > SHA256SUMS

        # Show build information
        {
          echo "Build Information:"
          echo "==================="
          echo "Build Date: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
          echo "Python version: $(python --version)"
          echo "GLIBC version: $(ldd --version | head -n 1)"
          echo "System: Ubuntu 22.04"
          echo "Architecture: $(uname -m)"
          echo "==================="
        } > build_info.txt

    - name: Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Upload artifacts
        gh release upload v${VERSION} \
          dotranslate_${VERSION}_amd64.deb \
          SHA256SUMS \
          build_info.txt \
          --clobber
        
        # Get existing release notes
        EXISTING_NOTES=$(gh release view v${VERSION} --json body -q '.body')
        
        # Prepare new notes
        NEW_NOTES="${EXISTING_NOTES}

        Linux build added ($(date -u '+%Y-%m-%d %H:%M:%S') UTC)
        - Architecture: amd64
        - Built on Ubuntu 22.04 LTS with compatibility patches
        - Minimum GLIBC: 2.31
        - Python: $(python --version)
        - SHA256: $(cat SHA256SUMS)
        - Dependencies: 
          * Python 3.9 or later
          * SDL2
          * MTDev
          * GLIBC 2.31 or later
          * libunwind8"
        
        # Update release with combined notes
        gh release edit v${VERSION} -n "$NEW_NOTES"
