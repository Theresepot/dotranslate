name: Linux Build

on:
  push:
    paths:
      - 'version.txt'
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-debian:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        debian-version: ['11', '12']
        include:
          - debian-version: '11'
            container-tag: 'bullseye'
          - debian-version: '12'
            container-tag: 'bookworm'

    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker
      run: |
        docker pull debian:${{ matrix.container-tag }}

    - name: Build in Docker
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          debian:${{ matrix.container-tag }} \
          bash -c '
            cd /workspace
            apt-get update
            apt-get install -y python3 python3-pip python3-venv fakeroot dpkg-dev
            python3 -m pip install --upgrade pip
            python3 -m pip install pyinstaller
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            
            # Get version
            VERSION=$(cat version.txt)
            
            # Build with PyInstaller
            pyinstaller --onefile --name dotranslate main.py
            
            # Create Debian package structure
            mkdir -p debian-package/DEBIAN
            mkdir -p debian-package/usr/local/bin
            
            # Copy executable
            cp dist/dotranslate debian-package/usr/local/bin/
            chmod +x debian-package/usr/local/bin/dotranslate
            
            # Create control file
            cat > debian-package/DEBIAN/control << EOF
            Package: dotranslate
            Version: $VERSION
            Section: utils
            Priority: optional
            Architecture: amd64
            Maintainer: Theresepot
            Description: DoTranslate - A translation tool
             A tool for translating text using various translation services.
            EOF
            
            # Build the package
            dpkg-deb --build debian-package
            
            # Rename the package
            mv debian-package.deb dotranslate_${VERSION}_debian${{ matrix.debian-version }}_amd64.deb
          '

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: dotranslate-debian${{ matrix.debian-version }}
        path: dotranslate_*_debian${{ matrix.debian-version }}_amd64.deb

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: github.ref == 'refs/heads/main'
      with:
        files: dotranslate_*_debian${{ matrix.debian-version }}_amd64.deb
        tag_name: v$(cat version.txt)
        draft: false
        prerelease: false
        append_body: true
        body: |
          Debian ${{ matrix.debian-version }} build added
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
