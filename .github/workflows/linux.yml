name: Linux Manual Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'  # Specifically using Python 3.10 for better compatibility
        cache: 'pip'

    - name: Build
      run: |
        # Install dependencies
        sudo apt-get update
        sudo apt-get install -y fakeroot dpkg-dev
        python -m pip install --upgrade pip
        pip install 'pyinstaller<6.0'  # Using an older, more stable version
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

        # Get version
        VERSION=$(cat version.txt)
        echo "VERSION=$VERSION" >> $GITHUB_ENV

        # Build executable
        pyinstaller --onefile --name dotranslate translator.py

        # Create package
        mkdir -p debian-package/DEBIAN debian-package/usr/local/bin
        cp dist/dotranslate debian-package/usr/local/bin/
        chmod +x debian-package/usr/local/bin/dotranslate

        # Create control file
        cat > debian-package/DEBIAN/control << EOF
        Package: dotranslate
        Version: $VERSION
        Section: utils
        Priority: optional
        Architecture: amd64
        Maintainer: Theresepot
        Description: DoTranslate - A translation tool
         A tool for translating text using various translation services.
        EOF

        # Build and rename package
        dpkg-deb --build debian-package
        mv debian-package.deb dotranslate_${VERSION}_amd64.deb

        # Generate checksum
        sha256sum dotranslate_${VERSION}_amd64.deb > SHA256SUMS

    - name: Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload v${{ env.VERSION }} dotranslate_${{ env.VERSION }}_amd64.deb SHA256SUMS --clobber
        gh release edit v${{ env.VERSION }} --notes-append "
        
        Linux build added
        - Build Date: $(date -u '+%Y-%m-%d %H:%M:%S') UTC
        - Architecture: amd64
        - SHA256: $(cat SHA256SUMS)"
