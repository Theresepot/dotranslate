name: Linux Manual Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          fakeroot \
          dpkg-dev \
          python3-pip \
          python3-dev \
          pkg-config \
          libgl1-mesa-dev \
          libgstreamer1.0-dev \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          xvfb \
          xauth \
          libmtdev1

    - name: Install Python packages
      run: |
        python -m pip install --upgrade pip
        pip install 'pyinstaller<6.0'
        pip install -r requirements.txt

    - name: Build with Xvfb
      run: |
        # Start Xvfb
        Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
        export DISPLAY=:99
        
        # Get version
        VERSION=$(cat version.txt)
        echo "VERSION=$VERSION" >> $GITHUB_ENV

        # Build executable
        pyinstaller --onefile --name dotranslate translator.py

        # Create package
        mkdir -p debian-package/DEBIAN debian-package/usr/local/bin
        cp dist/dotranslate debian-package/usr/local/bin/
        chmod +x debian-package/usr/local/bin/dotranslate

        # Create control file
        cat > debian-package/DEBIAN/control << EOF
        Package: dotranslate
        Version: $VERSION
        Section: utils
        Priority: optional
        Architecture: amd64
        Maintainer: Theresepot
        Description: DoTranslate - A translation tool
         A tool for translating text using various translation services.
        Depends: libsdl2-2.0-0, libmtdev1, python3
        EOF

        # Build package
        dpkg-deb --build debian-package
        mv debian-package.deb dotranslate_${VERSION}_amd64.deb

        # Generate checksum
        sha256sum dotranslate_${VERSION}_amd64.deb > SHA256SUMS

    - name: Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload v${{ env.VERSION }} \
          dotranslate_${VERSION}_amd64.deb \
          SHA256SUMS \
          --clobber
        
        gh release edit v${{ env.VERSION }} --notes-append "

        Linux build added
        - Build Date: $(date -u '+%Y-%m-%d %H:%M:%S') UTC
        - Architecture: amd64
        - SHA256: $(cat SHA256SUMS)
        - Dependencies: SDL2, MTDev, Python3"
