name: Linux Manual Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y fakeroot dpkg-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Build Application
      run: |
        pyinstaller --onefile --name dotranslate translator.py
        VERSION=$(cat version.txt)
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        
        # Create Debian package structure
        mkdir -p debian-package/DEBIAN
        mkdir -p debian-package/usr/local/bin
        
        # Copy executable and set permissions
        cp dist/dotranslate debian-package/usr/local/bin/
        chmod +x debian-package/usr/local/bin/dotranslate
        
        # Create control file
        cat > debian-package/DEBIAN/control << EOF
        Package: dotranslate
        Version: $VERSION
        Section: utils
        Priority: optional
        Architecture: amd64
        Maintainer: Theresepot
        Description: DoTranslate - A translation tool
         A tool for translating text using various translation services.
        EOF
        
        # Build package
        dpkg-deb --build debian-package
        mv debian-package.deb dotranslate_${VERSION}_amd64.deb
        
        # Generate checksum
        sha256sum dotranslate_${VERSION}_amd64.deb > dotranslate_${VERSION}_amd64.deb.sha256

    - name: Add to Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION=$(cat version.txt)
        gh release upload v${VERSION} \
          dotranslate_${VERSION}_amd64.deb \
          dotranslate_${VERSION}_amd64.deb.sha256 \
          --clobber

    - name: Update Release Notes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION=$(cat version.txt)
        BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M:%S')
        gh release edit v${VERSION} --notes-append "

        Linux build added
        - Build Date: ${BUILD_DATE}
        - Architecture: amd64
        - SHA256: $(cat dotranslate_${VERSION}_amd64.deb.sha256)"
