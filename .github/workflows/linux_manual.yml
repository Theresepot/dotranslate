name: Linux Manual Build V3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        apt-get update
        apt-get install -y fakeroot dpkg-dev git
        pip install pyinstaller
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Build and Package
      run: |
        VERSION=$(cat version.txt)
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        
        # Build executable
        pyinstaller --onefile --name dotranslate translator.py
        
        # Create package
        mkdir -p debian-package/DEBIAN debian-package/usr/local/bin
        cp dist/dotranslate debian-package/usr/local/bin/
        chmod +x debian-package/usr/local/bin/dotranslate
        
        cat > debian-package/DEBIAN/control << EOF
        Package: dotranslate
        Version: $VERSION
        Section: utils
        Priority: optional
        Architecture: amd64
        Maintainer: Theresepot
        Description: DoTranslate - A translation tool
         A tool for translating text using various translation services.
        EOF
        
        dpkg-deb --build debian-package
        mv debian-package.deb dotranslate_${VERSION}_amd64.deb

    - name: Install GitHub CLI
      run: |
        curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
        apt update
        apt install gh -y

    - name: Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        sha256sum dotranslate_${VERSION}_amd64.deb > SHA256SUMS
        
        # Upload files
        gh release upload v${VERSION} \
          dotranslate_${VERSION}_amd64.deb \
          SHA256SUMS \
          --clobber
        
        # Update release notes
        gh release edit v${VERSION} --notes-append "

        Linux build added
        - Build Date: $(date -u '+%Y-%m-%d %H:%M:%S')
        - Architecture: amd64
        - SHA256: $(cat SHA256SUMS)"
