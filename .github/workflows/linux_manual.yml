name: Linux Manual Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y fakeroot dpkg-dev

    - name: Install Python packages
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

    - name: Get version
      run: |
        VERSION=$(cat version.txt)
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Building version: $VERSION"

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --name dotranslate translator.py
        ls -la dist/

    - name: Create Debian package
      run: |
        mkdir -p debian-package/DEBIAN
        mkdir -p debian-package/usr/local/bin
        
        # Copy and set permissions
        cp dist/dotranslate debian-package/usr/local/bin/
        chmod +x debian-package/usr/local/bin/dotranslate
        
        # Create control file
        cat > debian-package/DEBIAN/control << EOF
        Package: dotranslate
        Version: ${{ env.VERSION }}
        Section: utils
        Priority: optional
        Architecture: amd64
        Maintainer: Theresepot
        Description: DoTranslate - A translation tool
         A tool for translating text using various translation services.
        EOF
        
        # Build package
        dpkg-deb --build debian-package
        mv debian-package.deb dotranslate_${{ env.VERSION }}_amd64.deb

    - name: Generate checksum
      run: |
        sha256sum dotranslate_${{ env.VERSION }}_amd64.deb > SHA256SUMS
        echo "Package checksum:"
        cat SHA256SUMS

    - name: Release to GitHub
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Upload the package and checksum
        gh release upload v${{ env.VERSION }} \
          dotranslate_${{ env.VERSION }}_amd64.deb \
          SHA256SUMS \
          --clobber
        
        # Update release notes
        BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M:%S')
        gh release edit v${{ env.VERSION }} --notes-append "

        Linux build added
        - Build Date: $BUILD_DATE UTC
        - Architecture: amd64
        - SHA256: $(cat SHA256SUMS)
        - Built by: ${{ github.actor }}"
