name: Build Windows Executable

on:
  push:
    branches:
      - main
    # Only trigger on version file changes
    paths:
      - 'version.txt'
  pull_request:
    branches:
      - main

jobs:
  build-windows-executable:
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Get version
        id: get_version
        shell: pwsh
        run: |
          $version = Get-Content version.txt
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "Version from file: $version"

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.11'
          architecture: 'x64'

      # [Previous dependency installation steps remain the same...]
      # [Previous build steps remain the same until packaging...]

      - name: Package Executable
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\dotranslate\*" -DestinationPath "dotranslate-windows.zip"
          # Generate SHA256 checksum
          $hash = Get-FileHash -Path "dotranslate-windows.zip" -Algorithm SHA256
          $hash.Hash | Out-File -FilePath "dotranslate-windows.zip.sha256"
          
          # Create release notes with version and build info
          @"
          DoTranslate Windows Build v${{ steps.get_version.outputs.version }}
          Build Date: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss")
          Built by: ${{ github.actor }}
          SHA256: $($hash.Hash)
          
          ### Changes in this version
          - Please see commit history for detailed changes
          "@ | Out-File -FilePath "release_notes.txt"

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.version }}"
          $tagName = "v${version}"
          $releaseName = "DoTranslate ${version}"
          $notes = Get-Content "release_notes.txt" | Out-String
          
          # Create release and upload assets
          gh release create $tagName `
            --title $releaseName `
            --notes "$notes" `
            dotranslate-windows.zip `
            dotranslate-windows.zip.sha256 `
            --target main

      - name: Upload Artifacts (for pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dotranslate-windows
          path: |
            dotranslate-windows.zip
            dotranslate-windows.zip.sha256
            release_notes.txt
          if-no-files-found: error
