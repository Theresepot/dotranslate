name: Build Windows Executable

# This permissions block automatically handles all required permissions
permissions:
  contents: write
  packages: write
  actions: write

on:
  push:
    branches:
      - main
    paths:
      - 'version.txt'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows-executable:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Get version
        id: get_version
        shell: pwsh
        run: |
          $version = Get-Content version.txt
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "Version from file: $version"

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install kivy
          pip install requests
          pip install pytesseract
          pip install Pillow
          pip install PyPDF2
          pip install PyDictionary
          pip install nltk
          pip install no-window

      - name: Download Tesseract
        run: |
          Invoke-WebRequest -Uri "https://github.com/UB-Mannheim/tesseract/releases/download/v5.3.1.20230401/tesseract-ocr-w64-setup-5.3.1.20230401.exe" -OutFile "tesseract-installer.exe"
          Start-Process -FilePath "tesseract-installer.exe" -ArgumentList "/S" -Wait

      - name: Add Tesseract to PATH
        run: |
          $env:Path += ";C:\Program Files\Tesseract-OCR"
          [Environment]::SetEnvironmentVariable("Path", $env:Path, [System.EnvironmentVariableTarget]::Machine)

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --add-data "C:\Program Files\Tesseract-OCR\tessdata;tessdata" translator.py

      - name: Create no_window.py
        shell: pwsh
        run: |
          @'
          import os
          os.environ['KIVY_GL_BACKEND'] = 'angle_sdl2'
          os.environ['KIVY_NO_ARGS'] = '1'
          from translator import TranslationApp
          if __name__ == '__main__':
              TranslationApp().run()
          '@ | Out-File -FilePath "no_window.py" -Encoding utf8

      - name: Create spec file
        shell: pwsh
        run: |
          @'
          # -*- mode: python ; coding: utf-8 -*-
          
          import os
          from kivy_deps import sdl2, glew, angle
          
          block_cipher = None
          
          a = Analysis(
              ['no_window.py'],
              pathex=[],
              binaries=[],
              datas=[
                  ('translator.py', '.'),
                  (os.path.join(HOMEPATH, 'PyInstaller', 'hooks'), 'PyInstaller/hooks')
              ],
              hiddenimports=[
                  'kivy',
                  'kivy.deps.sdl2',
                  'kivy.deps.glew',
                  'kivy.deps.angle',
                  'kivy.graphics.angle',
                  'kivy.graphics',
                  'kivy.core.window.window_info',
                  'kivy.core.window.window_sdl2',
                  'kivy.core.text',
                  'kivy.factory_registers',
                  'kivy.input.providers.mouse',
                  'kivy.input.providers.wm_common',
                  'nltk',
                  'PIL',
                  'pytesseract',
                  'PyPDF2',
                  'PyDictionary',
                  'goslate',
                  'bs4'
              ],
              hookspath=[],
              hooksconfig={},
              runtime_hooks=[],
              excludes=[],
              win_no_prefer_redirects=False,
              win_private_assemblies=False,
              cipher=block_cipher,
              noarchive=False
          )
          
          pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)
          
          exe = EXE(
              pyz,
              a.scripts,
              a.binaries,
              a.zipfiles,
              a.datas,
              *[Tree(p) for p in (sdl2.dep_bins + glew.dep_bins + angle.dep_bins)],
              name='dotranslate',
              debug=False,
              bootloader_ignore_signals=False,
              strip=False,
              upx=True,
              console=False,
              disable_windowed_traceback=False,
              argv_emulation=False,
              target_arch=None,
              codesign_identity=None,
              entitlements_file=None,
          )
          '@ | Out-File -FilePath "translator.spec" -Encoding utf8

      - name: Build Executable
        shell: pwsh
        run: |
          # Force use of ANGLE backend
          $env:KIVY_GL_BACKEND = "angle_sdl2"
          $env:KIVY_NO_ARGS = "1"
          $env:KIVY_NO_CONSOLELOG = "1"
          
          Write-Host "Starting PyInstaller build..."
          pyinstaller --clean translator.spec
          
          Write-Host "Build complete. Checking dist directory:"
          Get-ChildItem dist -Recurse | Format-Table Name, Length, LastWriteTime

      - name: Package Executable
        shell: pwsh
        run: |
          # Check if dist directory exists and show its contents
          Write-Host "Checking dist directory contents:"
          Get-ChildItem dist -Recurse | Format-Table FullName, Length, LastWriteTime
          
          # Create output directory if it doesn't exist
          New-Item -ItemType Directory -Force -Path output
          
          # Package the executable and its dependencies
          Write-Host "Packaging executable..."
          if (Test-Path "dist\dotranslate.exe") {
              Compress-Archive -Path "dist\dotranslate.exe" -DestinationPath "output\dotranslate-windows.zip" -Force
          } elseif (Test-Path "dist\dotranslate") {
              Compress-Archive -Path "dist\dotranslate\*" -DestinationPath "output\dotranslate-windows.zip" -Force
          } else {
              Write-Host "::error::No executable found in dist directory"
              exit 1
          }
          
          # Generate SHA256 checksum
          $hash = Get-FileHash -Path "output\dotranslate-windows.zip" -Algorithm SHA256
          $hash.Hash | Out-File -FilePath "output\dotranslate-windows.zip.sha256"
          
          # Create release notes
          @"
          DoTranslate Windows Build v${{ steps.get_version.outputs.version }}
          Build Date: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss")
          Built by: ${{ github.actor }}
          SHA256: $($hash.Hash)
          
          ### Changes in this version
          - Please see commit history for detailed changes
          "@ | Out-File -FilePath "output\release_notes.txt"

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.version }}"
          $tagName = "v${version}"
          $releaseName = "DoTranslate ${version}"
          $notes = Get-Content "output\release_notes.txt" | Out-String
          
          # Create release and upload assets
          gh release create $tagName `
            --title $releaseName `
            --notes "$notes" `
            "output\dotranslate-windows.zip" `
            "output\dotranslate-windows.zip.sha256" `
            --target main

      - name: Upload Artifacts (for pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dotranslate-windows
          path: |
            output/dotranslate-windows.zip
            output/dotranslate-windows.zip.sha256
            output/release_notes.txt
          if-no-files-found: error
