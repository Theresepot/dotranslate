name: Build Windows Executable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-windows-executable:
    runs-on: windows-2022

    steps:
      # Step 1: Check out the repository
      - name: Check out code
        uses: actions/checkout@v3

      # Step 2: Set up Python with explicit path
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.11'
          architecture: 'x64'

      # Step 3: Install dependencies
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install wheel setuptools
          
          # Install Kivy dependencies first
          pip install kivy_deps.sdl2==0.6.0
          pip install kivy_deps.glew==0.3.1
          pip install kivy_deps.gstreamer==0.3.3
          pip install kivy_deps.angle==0.3.3
          
          # Install Kivy
          pip install kivy==2.2.1
          
          # Install NLTK and download required data
          pip install nltk
          python -c "import nltk; nltk.download('punkt', quiet=True)"
          python -c "import nltk; nltk.download('wordnet', quiet=True)"
          
          # Install other dependencies
          pip install requests==2.31.0
          pip install pyinstaller==6.3.0
          pip install pytesseract==0.3.10
          pip install Pillow==10.2.0
          pip install PyPDF2==3.0.1
          pip install --no-deps PyDictionary
          pip install goslate --no-deps
          pip install beautifulsoup4

      # Step 4: Install Tesseract OCR
      - name: Install Tesseract
        shell: pwsh
        run: |
          choco install tesseract -y
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          Write-Host "Tesseract version:"
          tesseract --version

      # Step 5: Create PyInstaller hook and spec files
      - name: Create PyInstaller files
        shell: pwsh
        run: |
          # Create hook file
          @'
          from PyInstaller.utils.hooks import collect_data_files, collect_submodules

          # Add Kivy hooks
          hiddenimports = collect_submodules('kivy')
          datas = collect_data_files('kivy')

          # Add additional dependencies
          hiddenimports += [
              'kivy.deps.sdl2',
              'kivy.deps.glew',
              'kivy.deps.gstreamer',
              'kivy.deps.angle',
              'kivy.factory_registers',
              'kivy.input.providers.mouse',
              'kivy.input.providers.wm_common',
              'kivy.input.providers.wm_touch',
              'kivy.input.providers.wm_pen',
              'kivy.core.window.window_info',
              'kivy.core.window.window_sdl2',
              'kivy.core.text.text_sdl2',
              'kivy.core.text',
              'kivy.core.audio',
              'kivy.core.camera',
              'kivy.core.clipboard',
              'kivy.core.image',
              'kivy.core.spelling',
              'kivy.core.video',
              'kivy.core.window',
              'kivy.graphics.context_instructions',
              'kivy.graphics.fbo',
              'kivy.graphics.instructions',
              'kivy.graphics.shader',
              'kivy.graphics.texture',
              'kivy.graphics.transformation',
              'kivy.graphics.vbo',
              'kivy.graphics.vertex',
              'kivy.graphics.vertex_instructions',
              'kivy.support',
              'nltk',
              'PIL',
              'pytesseract',
              'PyPDF2',
              'PyDictionary',
              'goslate',
              'bs4'
          ]

          # Add binary dependencies
          binaries = []
          '@ | Out-File -FilePath "hook-translator.py" -Encoding utf8

          # Create spec file
          @'
          # -*- mode: python ; coding: utf-8 -*-

          from kivy_deps import sdl2, glew, gstreamer, angle

          block_cipher = None

          a = Analysis(
              ['translator.py'],
              pathex=[],
              binaries=[],
              datas=[],
              hiddenimports=[],
              hookspath=['.'],
              hooksconfig={},
              runtime_hooks=[],
              excludes=[],
              win_no_prefer_redirects=False,
              win_private_assemblies=False,
              cipher=block_cipher,
              noarchive=False,
          )

          pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)

          exe = EXE(
              pyz,
              a.scripts,
              a.binaries,
              a.zipfiles,
              a.datas,
              *[Tree(p) for p in (sdl2.dep_bins + glew.dep_bins + gstreamer.dep_bins + angle.dep_bins)],
              name='dotranslate',
              debug=False,
              bootloader_ignore_signals=False,
              strip=False,
              upx=True,
              upx_exclude=[],
              runtime_tmpdir=None,
              console=True,
              disable_windowed_traceback=False,
              argv_emulation=False,
              target_arch=None,
              codesign_identity=None,
              entitlements_file=None,
          )
          '@ | Out-File -FilePath "translator.spec" -Encoding utf8

      # Step 6: Build the executable
      - name: Build Executable
        shell: pwsh
        run: |
          Write-Host "Starting PyInstaller build..."
          pyinstaller --clean translator.spec
          Write-Host "Build complete. Checking dist directory:"
          Get-ChildItem dist | Format-Table Name, Length, LastWriteTime

      # Step 7: Verify executable exists
      - name: Verify Build
        shell: pwsh
        run: |
          $exePath = "dist/dotranslate.exe"
          if (Test-Path $exePath) {
              Write-Host "Executable was built successfully"
              Get-Item $exePath | Select-Object FullName, Length, CreationTime, LastWriteTime | Format-List
          } else {
              Write-Host "::error::Executable was not built"
              Write-Host "Current directory contents:"
              Get-ChildItem -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
              exit 1
          }

      # Step 8: Upload the artifact
      - name: Upload Executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dotranslate-windows
          path: dist/dotranslate.exe
          if-no-files-found: error
