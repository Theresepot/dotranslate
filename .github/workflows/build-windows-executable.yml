name: Build Windows Executable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-windows-executable:
    runs-on: windows-2022
    timeout-minutes: 15  # Add timeout to prevent infinite builds

    steps:
      # Step 1: Check out the repository
      - name: Check out code
        uses: actions/checkout@v3

      # Step 2: Set up Python with explicit path
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.11'
          architecture: 'x64'

      # Step 3: Install dependencies
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install wheel setuptools
          
          # Install Kivy dependencies first
          pip install kivy_deps.sdl2==0.6.0
          pip install kivy_deps.glew==0.3.1
          pip install kivy_deps.angle==0.3.3
          
          # Install Kivy
          pip install kivy==2.2.1
          
          # Install NLTK and download required data
          pip install nltk
          python -c "import nltk; nltk.download('punkt', quiet=True)"
          python -c "import nltk; nltk.download('wordnet', quiet=True)"
          
          # Install other dependencies
          pip install requests==2.31.0
          pip install pyinstaller==6.3.0
          pip install pytesseract==0.3.10
          pip install Pillow==10.2.0
          pip install PyPDF2==3.0.1
          pip install --no-deps PyDictionary
          pip install goslate --no-deps
          pip install beautifulsoup4

      # Step 4: Install Tesseract OCR
      - name: Install Tesseract
        shell: pwsh
        run: |
          choco install tesseract -y
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

      # Step 5: Create spec file
      - name: Create PyInstaller spec
        shell: pwsh
        run: |
          @'
          # -*- mode: python ; coding: utf-8 -*-

          from kivy_deps import sdl2, glew, angle

          a = Analysis(
              ['translator.py'],
              pathex=[],
              binaries=[],
              datas=[('C:\\\\hostedtoolcache\\\\windows\\\\Python\\\\3.11.9\\\\x64\\\\Lib\\\\site-packages\\\\kivy\\\\data', 'kivy_install\\\\data')],
              hiddenimports=[
                  'kivy.deps.sdl2',
                  'kivy.deps.glew',
                  'kivy.deps.angle',
                  'kivy.factory_registers',
                  'kivy.input.providers.mouse',
                  'kivy.input.providers.wm_common',
                  'kivy.input.providers.wm_touch',
                  'kivy.input.providers.wm_pen',
                  'kivy.core.window.window_info',
                  'kivy.core.window.window_sdl2',
                  'kivy.core.text.text_sdl2',
                  'kivy.core.text',
                  'kivy.core.clipboard',
                  'kivy.core.image',
                  'kivy.graphics',
                  'nltk',
                  'PIL',
                  'pytesseract',
                  'PyPDF2',
                  'PyDictionary',
                  'goslate',
                  'bs4'
              ],
              hookspath=[],
              hooksconfig={},
              runtime_hooks=[],
              excludes=[],
              win_no_prefer_redirects=False,
              win_private_assemblies=False,
              noarchive=False
          )

          pyz = PYZ(a.pure, a.zipped_data)

          exe = EXE(
              pyz,
              a.scripts,
              [],
              exclude_binaries=True,
              name='dotranslate',
              debug=False,
              bootloader_ignore_signals=False,
              strip=False,
              upx=True,
              console=False,
              disable_windowed_traceback=False,
              argv_emulation=False,
              target_arch=None,
              codesign_identity=None,
              entitlements_file=None,
          )

          coll = COLLECT(
              exe,
              a.binaries,
              a.zipfiles,
              a.datas,
              *[Tree(p) for p in (sdl2.dep_bins + glew.dep_bins + angle.dep_bins)],
              strip=False,
              upx=True,
              upx_exclude=[],
              name='dotranslate'
          )
          '@ | Out-File -FilePath "translator.spec" -Encoding utf8

      # Step 6: Build the executable
      - name: Build Executable
        shell: pwsh
        run: |
          # Set environment variables to prevent Kivy from initializing graphics
          $env:KIVY_NO_ARGS = "1"
          $env:KIVY_NO_CONSOLELOG = "1"
          
          Write-Host "Starting PyInstaller build..."
          pyinstaller --clean translator.spec
          Write-Host "Build complete. Checking dist directory:"
          Get-ChildItem dist\dotranslate -Recurse | Format-Table FullName, Length, LastWriteTime

      # Step 7: Package the executable
      - name: Package Executable
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\dotranslate" -DestinationPath "dotranslate-windows.zip"

      # Step 8: Upload the artifact
      - name: Upload Executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dotranslate-windows
          path: dotranslate-windows.zip
          if-no-files-found: error
