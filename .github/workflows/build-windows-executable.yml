name: Build Windows Executable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-windows-executable:
    runs-on: windows-2022

    steps:
      # Step 1: Check out the repository
      - name: Check out code
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.11'

      # Step 3: Install dependencies
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install wheel setuptools
          # Install NLTK first
          pip install nltk
          python -c "import nltk; nltk.download('punkt', quiet=True)"
          python -c "import nltk; nltk.download('wordnet', quiet=True)"
          # Install other dependencies one by one to avoid conflicts
          pip install kivy==2.2.1
          pip install requests==2.31.0
          pip install pyinstaller==6.3.0
          pip install pytesseract==0.3.10
          pip install Pillow==10.2.0
          pip install PyPDF2==3.0.1
          pip install --no-deps PyDictionary
          pip install goslate --no-deps
          pip install beautifulsoup4

      # Step 4: Install Tesseract OCR
      - name: Install Tesseract
        shell: pwsh
        run: |
          choco install tesseract -y
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          Write-Host "Tesseract version:"
          tesseract --version
          Write-Host "Tesseract location:"
          where.exe tesseract

      # Step 5: Build the executable
      - name: Build Executable
        shell: pwsh
        run: |
          Write-Host "Starting PyInstaller build..."
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          
          python -m PyInstaller `
            --onefile `
            --name dotranslate `
            --hidden-import nltk `
            --hidden-import nltk.tokenize `
            --hidden-import nltk.corpus `
            --hidden-import nltk.corpus.wordnet `
            --hidden-import kivy `
            --hidden-import PIL `
            --hidden-import pytesseract `
            --hidden-import PyPDF2 `
            --hidden-import PyDictionary `
            --hidden-import goslate `
            --hidden-import beautifulsoup4 `
            --collect-all kivy `
            --collect-all nltk `
            translator.py

          Write-Host "Build complete. Checking dist directory:"
          Get-ChildItem dist | Format-Table Name, Length, LastWriteTime

      # Step 6: Verify executable exists and show build info
      - name: Verify Build
        shell: pwsh
        run: |
          $exePath = "dist/dotranslate.exe"
          if (Test-Path $exePath) {
              Write-Host "Executable was built successfully"
              Get-Item $exePath | Select-Object FullName, Length, CreationTime, LastWriteTime | Format-List
          } else {
              Write-Host "::error::Executable was not built"
              Write-Host "Current directory contents:"
              Get-ChildItem -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
              Write-Host "PyInstaller build logs:"
              if (Test-Path "build/dotranslate/warn-dotranslate.txt") {
                  Get-Content "build/dotranslate/warn-dotranslate.txt"
              }
              exit 1
          }

      # Step 7: Upload the artifact
      - name: Upload Executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dotranslate-windows
          path: dist/dotranslate.exe
          if-no-files-found: error

      # Step 8: Upload build logs on failure
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/
            *.spec
          if-no-files-found: warn
