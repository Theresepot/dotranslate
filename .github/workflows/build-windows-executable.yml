name: Build Windows Executable

on:
  push:
    branches: ["main"]  # Or your default branch

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Tesseract OCR (Windows)
        run: |
          curl -L -o tesseract.zip https://github.com/UB-Mannheim/tesseract/wiki/tesseract-ocr-w64-setup-v5.3.3.20231005.exe
          7z x tesseract.zip -otess_tmp
          # Find tesseract.exe and tessdata
          for /r tess_tmp %%f in (tesseract.exe) do copy "%%f" .
          for /r tess_tmp %%d in (tessdata) do xcopy /E /I /Y "%%d" dist\tessdata
          del /Q /F tesseract.zip
          rmdir /S /Q tess_tmp

      - name: Set Kivy to use mock OpenGL backend
        run: echo "KIVY_GL_BACKEND=mock" >> $env:GITHUB_ENV

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm translator.spec
          mkdir dist_win
          move dist\translator.exe dist_win\
          copy tesseract.exe dist_win\
          xcopy /E /I /Y dist\tessdata dist_win\tessdata

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: dist_win
