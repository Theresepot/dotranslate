name: Build Windows Executable

# This permissions block automatically handles all required permissions
permissions:
  contents: write
  packages: write
  actions: write

on:
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - 'version.txt'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version
        id: get_version
        run: |
          $version = (Get-Content version.txt).Trim()
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install kivy==2.2.1
          pip install kivy_deps.sdl2==0.6.0
          pip install kivy_deps.glew==0.3.1
          pip install kivy_deps.angle==0.3.3
          pip install requests
          pip install pytesseract
          pip install Pillow
          pip install PyPDF2
          pip install PyDictionary
          pip install nltk
          pip install goslate
          pip install beautifulsoup4
          pip install flake8
          pip install pytest

      - name: Run linting
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Install Tesseract
        run: |
          $tesseractUrl = "https://github.com/UB-Mannheim/tesseract/releases/download/v5.3.1.20230401/tesseract-ocr-w64-setup-5.3.1.20230401.exe"
          $installerPath = "tesseract-installer.exe"
          $tesseractPath = "C:\Program Files\Tesseract-OCR"
          
          # Download Tesseract installer
          Invoke-WebRequest -Uri $tesseractUrl -OutFile $installerPath
          
          # Install Tesseract silently
          Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait
          
          # Add Tesseract to PATH
          $env:Path = "$env:Path;$tesseractPath"
          [Environment]::SetEnvironmentVariable("Path", $env:Path, [System.EnvironmentVariableTarget]::Machine)
          
          # Verify installation
          Write-Host "Tesseract version:"
          & "$tesseractPath\tesseract.exe" --version

      - name: Create Kivy config
        run: |
          echo "[graphics]" > kivy_config.ini
          echo "multisamples = 0" >> kivy_config.ini
          echo "window_icon = " >> kivy_config.ini
          echo "exit_on_escape = 1" >> kivy_config.ini

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --add-data "C:\Program Files\Tesseract-OCR\tessdata;tessdata" --add-data "kivy_config.ini;." translator.py

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/translator.exe
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: |
            Windows executable for version ${{ env.VERSION }}
            
            Changes in this version:
            - See commit history for details
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable-v${{ env.VERSION }}
          path: dist/translator.exe
