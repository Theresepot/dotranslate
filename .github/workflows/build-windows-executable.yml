name: Build Windows Executable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-windows-executable:
    runs-on: windows-2022

    steps:
      # Step 1: Check out the repository
      - name: Check out code
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.11'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel setuptools
          # Install NLTK first
          pip install nltk
          python -c "import nltk; nltk.download('punkt')"
          # Install other dependencies one by one to avoid conflicts
          pip install kivy==2.2.1
          pip install requests==2.31.0
          pip install pyinstaller==6.3.0
          pip install pytesseract==0.3.10
          pip install Pillow==10.2.0
          pip install PyPDF2==3.0.1
          pip install --no-deps PyDictionary
          # Install goslate separately without futures
          pip install goslate --no-deps

      # Step 4: Build the executable
      - name: Build Executable
        shell: cmd
        run: |
          mkdir dist
          pyinstaller --onefile --name dotranslate ^
          --hidden-import kivy ^
          --hidden-import PIL ^
          --hidden-import pytesseract ^
          --hidden-import PyPDF2 ^
          --hidden-import PyDictionary ^
          --hidden-import nltk ^
          --hidden-import nltk.tokenize ^
          --hidden-import goslate ^
          --collect-all kivy ^
          main.py
          dir dist

      # Step 5: Verify executable exists
      - name: Verify Build
        run: |
          if (Test-Path "dist/dotranslate.exe") {
              echo "Executable was built successfully"
          } else {
              echo "::error::Executable was not built"
              exit 1
          }

      # Step 6: Upload the artifact
      - name: Upload Executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dotranslate-windows
          path: dist/dotranslate.exe
          if-no-files-found: error
