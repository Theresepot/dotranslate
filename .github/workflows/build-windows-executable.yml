name: Build Windows Executable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-windows-executable:
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install wheel setuptools
          
          # Install Kivy dependencies
          pip install kivy_deps.sdl2==0.6.0
          pip install kivy_deps.glew==0.3.1
          pip install kivy_deps.angle==0.3.3
          
          # Force Kivy to use ANGLE instead of OpenGL
          $env:KIVY_GL_BACKEND = "angle_sdl2"
          pip install kivy==2.2.1
          
          # Install other dependencies
          pip install requests==2.31.0
          pip install pyinstaller==6.3.0
          pip install pytesseract==0.3.10
          pip install Pillow==10.2.0
          pip install PyPDF2==3.0.1
          pip install --no-deps PyDictionary
          pip install goslate --no-deps
          pip install beautifulsoup4

      - name: Install Tesseract
        shell: pwsh
        run: |
          choco install tesseract -y

      - name: Create no_window.py
        shell: pwsh
        run: |
          @'
          import os
          os.environ['KIVY_GL_BACKEND'] = 'angle_sdl2'
          os.environ['KIVY_NO_ARGS'] = '1'
          from translator import TranslationApp
          if __name__ == '__main__':
              TranslationApp().run()
          '@ | Out-File -FilePath "no_window.py" -Encoding utf8

      - name: Create spec file
        shell: pwsh
        run: |
          @'
          # -*- mode: python ; coding: utf-8 -*-
          
          import os
          from kivy_deps import sdl2, glew, angle
          
          block_cipher = None
          
          # Get Kivy data directory
          kivy_data_dir = os.path.join(os.path.dirname('__file__'), 'kivy_install', 'data')
          
          a = Analysis(
              ['no_window.py'],
              pathex=[],
              binaries=[],
              datas=[
                  ('translator.py', '.'),
                  (os.path.join(HOMEPATH, 'PyInstaller', 'hooks'), 'PyInstaller/hooks')
              ],
              hiddenimports=[
                  'kivy',
                  'kivy.deps.sdl2',
                  'kivy.deps.glew',
                  'kivy.deps.angle',
                  'kivy.graphics.angle',
                  'kivy.graphics',
                  'kivy.core.window.window_info',
                  'kivy.core.window.window_sdl2',
                  'kivy.core.text',
                  'kivy.factory_registers',
                  'kivy.input.providers.mouse',
                  'kivy.input.providers.wm_common',
                  'nltk',
                  'PIL',
                  'pytesseract',
                  'PyPDF2',
                  'PyDictionary',
                  'goslate',
                  'bs4'
              ],
              hookspath=[],
              hooksconfig={},
              runtime_hooks=[],
              excludes=[],
              win_no_prefer_redirects=False,
              win_private_assemblies=False,
              cipher=block_cipher,
              noarchive=False
          )
          
          pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)
          
          exe = EXE(
              pyz,
              a.scripts,
              [],
              exclude_binaries=True,
              name='dotranslate',
              debug=False,
              bootloader_ignore_signals=False,
              strip=False,
              upx=True,
              console=False,
              disable_windowed_traceback=False,
              argv_emulation=False,
              target_arch=None,
              codesign_identity=None,
              entitlements_file=None,
          )
          
          coll = COLLECT(
              exe,
              a.binaries,
              a.zipfiles,
              a.datas,
              *[Tree(p) for p in (sdl2.dep_bins + glew.dep_bins + angle.dep_bins)],
              strip=False,
              upx=True,
              upx_exclude=[],
              name='dotranslate'
          )
          '@ | Out-File -FilePath "translator.spec" -Encoding utf8

      - name: Build Executable
        shell: pwsh
        run: |
          # Force use of ANGLE backend
          $env:KIVY_GL_BACKEND = "angle_sdl2"
          $env:KIVY_NO_ARGS = "1"
          $env:KIVY_NO_CONSOLELOG = "1"
          
          Write-Host "Starting PyInstaller build..."
          pyinstaller --clean translator.spec
          Write-Host "Build complete. Checking dist directory:"
          Get-ChildItem dist\dotranslate -Recurse | Format-Table Name, Length, LastWriteTime

      - name: Package Executable
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\dotranslate\*" -DestinationPath "dotranslate-windows.zip"

      - name: Upload Executable
        uses: actions/upload-artifact@v4
        with:
          name: dotranslate-windows
          path: dotranslate-windows.zip
          if-no-files-found: error
