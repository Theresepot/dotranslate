name: Build Linux Executable

permissions:
  contents: write
  packages: write
  actions: write

on:
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - 'version.txt'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version
        id: get_version
        run: |
          VERSION=$(cat version.txt)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          sudo apt-get install -y python3-dev
          sudo apt-get install -y libsdl2-dev
          sudo apt-get install -y libsdl2-image-dev
          sudo apt-get install -y libsdl2-mixer-dev
          sudo apt-get install -y libsdl2-ttf-dev
          sudo apt-get install -y libportmidi-dev
          sudo apt-get install -y libswscale-dev
          sudo apt-get install -y libavformat-dev
          sudo apt-get install -y libavcodec-dev
          sudo apt-get install -y zlib1g-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install kivy==2.2.1
          pip install requests
          pip install pytesseract
          pip install Pillow
          pip install PyPDF2
          pip install PyDictionary
          pip install nltk
          pip install goslate
          pip install beautifulsoup4
          pip install flake8
          pip install pytest

      - name: Run linting
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Create Kivy config
        run: |
          echo "[graphics]" > kivy_config.ini
          echo "multisamples = 0" >> kivy_config.ini
          echo "window_icon = " >> kivy_config.ini
          echo "exit_on_escape = 1" >> kivy_config.ini

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --add-data "/usr/share/tesseract-ocr/4.00/tessdata:tessdata" --add-data "kivy_config.ini:." translator.py

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/translator
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: |
            Linux executable for version ${{ env.VERSION }}
            
            Changes in this version:
            - See commit history for details
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-executable-v${{ env.VERSION }}
          path: dist/translator 